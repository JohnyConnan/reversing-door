name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: site

      - name: Build
        run: pnpm build
        working-directory: site

      - name: Verify export shape
        # Guards the URL inventory the site depends on (plan KTD-2: /en must export
        # as out/en.html, never out/en/index.html) and the metadata parity fixes.
        run: |
          set -e
          test -f out/index.html
          test -f out/en.html
          test ! -e out/en/index.html
          test -f out/404.html
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/og-image.jpg
          test -f out/ico/favicon.ico
          grep -q 'property="og:image"' out/en.html
          grep -qi 'hreflang="x-default"' out/index.html
          grep -q '<html lang="cs"' out/index.html
          grep -q '<html lang="en"' out/en.html
          test -f out/fonts/advent-pro-latin.woff2
        working-directory: site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
